name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:/usr/local/node/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$(npm config get prefix 2>/dev/null)/bin
            echo "NODE PATH: $(which node || echo 'not found')"
            echo "NPM PATH: $(which npm || echo 'not found')"
            echo "PM2 PATH: $(which pm2 || echo 'not found')"
            cd ~/viral_re
            git pull origin main
            npm run build
            pm2 restart viral-re || pm2 start npm --name "viral-re" -- start
            pm2 save
